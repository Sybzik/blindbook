[package]
name = "blindbook-verify"
description = "Independent auditor for Blindbook's public log: hash chain, every batch replayed with the engine, pool continuity, every blind signature's DLEQ proof against keys derived from M, supply per keyset"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["chain"]
# The on-chain reserve check (a view-only wallet of the published reserve key, over
# lightwalletd). Off for the browser build.
chain = ["dep:blindbook-indexer", "dep:blindbook-treasury"]

[dependencies]
blindbook-indexer = { path = "../blindbook-indexer", optional = true }
blindbook-treasury = { path = "../blindbook-treasury", optional = true }
blindbook-ledger = { path = "../blindbook-ledger" }
blindbook-mint = { path = "../blindbook-mint" }
flate2 = "1"
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
